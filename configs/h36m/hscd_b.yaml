experiment:
  name: hscd_b_h36m
  output_dir: runs/hscd_b_h36m
  seed: 1                # implementation choice; original run seed is not reported

data:
  dataset: Human3.6M
  train_file: data/h36m_train.npz
  valid_file: data/h36m_valid.npz
  input_frames: 243
  num_joints: 17
  input_dim: 2
  output_dim: 3
  train_subjects: [S1, S5, S6, S7, S8]
  test_subjects: [S9, S11]
  detector: CPN
  root_relative: true
  metric_scale: 1000.0
  metrics: [MPJPE, P-MPJPE]
  num_workers: 4

model:
  name: HSCD-B
  feature_dim: 256
  mie_layers: 6
  attention_heads: 4
  attention_head_dim: 64
  ffn_ratio: 2.0
  dropout: 0.0          # implementation choice; not specified in the manuscript
  decoder_channels: [64, 96, 128, 160]  # exposed because exact widths are not reported
  decoder_blocks_per_scale: 1
  temporal_scales: 4

diffusion:
  training_noise_levels: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  prediction_target: noise
  reverse_steps: 50
  clip_x0: null

training:
  optimizer: AdamW
  epochs: 100
  batch_size: 16
  learning_rate: 0.00005
  weight_decay: null    # set from the authors' original run if available
  lr_decay: 0.99
  eval_every: 5         # engineering choice for this reference implementation
  save_every: 10        # engineering choice for this reference implementation
  device: auto
